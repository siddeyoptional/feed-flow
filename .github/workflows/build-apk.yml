name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create dummy configuration files
        run: |
          echo "dropbox_key=dummy_key" > keystore.properties
          cat << 'EOF' > androidApp/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-feedflow",
              "storage_bucket": "dummy-feedflow.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.prof18.feedflow"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Assemble Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeedFlow-Debug-APK
          path: androidApp/build/outputs/apk/**/*.apk
